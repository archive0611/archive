{% extends "_auth_base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="card p-6">
  <div class="flex items-center justify-between mb-3">
    <span class="font-semibold text-gray-800">비밀번호 변경</span>
    <span class="text-sm text-gray-500">{{ auth_user }}</span>
  </div>
  <form method="post" class="space-y-3">
    <input type="text" name="username" value="{{ auth_user }}" autocomplete="username" hidden>
    <label class="block"><span class="text-sm text-gray-700">현재 비밀번호</span>
      <input class="inp mt-1" type="password" name="current" autocomplete="current-password" required></label>
    <label class="block"><span class="text-sm text-gray-700">새 비밀번호 (4자 이상)</span>
      <input class="inp mt-1" type="password" name="new" autocomplete="new-password" minlength="4" required></label>
    <label class="block"><span class="text-sm text-gray-700">새 비밀번호 확인</span>
      <input class="inp mt-1" type="password" name="new2" autocomplete="new-password" minlength="4" required></label>
    {% if error %}<p class="text-sm text-red-500">{{ error }}</p>{% endif %}
    {% if ok %}<p class="text-sm text-green-600">{{ ok }}</p>{% endif %}
    <div class="flex items-center gap-3">
      <button class="btn-primary">변경</button>
      <a href="/" class="text-sm text-gray-500 hover:underline">← 돌아가기</a>
    </div>
  </form>
</div>
{% endblock %}
